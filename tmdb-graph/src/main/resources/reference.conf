# =============================================================================
# 图数据库配置（tmdbwh.graph）
#
# queries.* 定义"从数仓哪张表、取哪些字段"装载图节点与关系。
# 抽成配置的原因：图装载的数据源会随分层调整而变（例如维度换成新表），
# 改配置即可，不需要改代码重新发版。
# =============================================================================
tmdbwh.graph {
  batch-size = 1000
  batch-size = ${?GRAPH_BATCH_SIZE}

  # 全量重建前是否要求显式确认（防止误操作清空图）
  require-confirm-for-clear = true

  queries {
    # ---- 节点：SELECT 必须返回与图属性同名的列 ----
    node {
      Movie     = "SELECT movie_id, title, release_year, runtime, popularity, vote_average, vote_count, budget, revenue FROM dwd.dim_movie WHERE valid_to = toDateTime('2099-12-31 00:00:00')"
      Person    = "SELECT person_id, name, gender, known_for_department, popularity FROM dwd.dim_person WHERE valid_to = toDateTime('2099-12-31 00:00:00')"
      Genre     = "SELECT genre_id, genre_name AS name, media_type FROM dwd.dim_genre"
      Company   = "SELECT company_id, name FROM dwd.dim_company"
      Keyword   = "SELECT keyword_id, keyword_name AS name FROM dwd.dim_keyword"
      Country   = "SELECT country_code, country_name_en AS name FROM dwd.dim_country"
    }

    # ---- 关系：必须返回 from_id / to_id 两列，其余列作为关系属性 ----
    edge {
      ACTED_IN     = "SELECT person_id AS from_id, movie_id AS to_id, character_name, cast_order FROM dwd.fact_movie_credit WHERE credit_type = 'cast'"
      DIRECTED     = "SELECT person_id AS from_id, movie_id AS to_id FROM dwd.fact_movie_credit WHERE is_director = 1"
      CREW_OF      = "SELECT person_id AS from_id, movie_id AS to_id, department, job FROM dwd.fact_movie_credit WHERE credit_type = 'crew' AND is_director = 0"
      HAS_GENRE    = "SELECT movie_id AS from_id, genre_id AS to_id FROM dwd.bridge_movie_genre"
      PRODUCED_BY  = "SELECT movie_id AS from_id, company_id AS to_id FROM dwd.bridge_movie_company"
      HAS_KEYWORD  = "SELECT movie_id AS from_id, keyword_id AS to_id FROM dwd.bridge_movie_keyword"
      FROM_COUNTRY = "SELECT movie_id AS from_id, country_code AS to_id FROM dwd.bridge_movie_country"
    }
  }

  # ---- 分析结果回流（图分析 → ClickHouse）----
  output {
    database = "ads"
    centrality-table = "ads.ads_person_centrality"
    similarity-table = "ads.ads_movie_similarity"
  }
}
