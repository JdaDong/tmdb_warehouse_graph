# =============================================================================
# Spark 默认配置（Master / Worker / History Server / spark-submit 共用）
# 作业级参数（内存、并行度）在提交时覆盖；凭证通过环境变量 AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY 注入。
# =============================================================================

# ---------- Iceberg 湖仓：catalog 名 lake（与 reference.conf tmdbwh.iceberg.catalog-name 一致） ----------
spark.sql.extensions                              org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
spark.sql.catalog.lake                            org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.lake.type                       hive
spark.sql.catalog.lake.uri                        thrift://hive-metastore:9083
spark.sql.catalog.lake.warehouse                  s3a://tmdb-lake/warehouse
spark.sql.defaultCatalog                          lake

# ---------- S3A（MinIO） ----------
spark.hadoop.fs.s3a.endpoint                      http://minio:9000
spark.hadoop.fs.s3a.path.style.access             true
spark.hadoop.fs.s3a.connection.ssl.enabled        false
spark.hadoop.fs.s3a.impl                          org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3a.aws.credentials.provider      com.amazonaws.auth.EnvironmentVariableCredentialsProvider
spark.hadoop.fs.s3a.fast.upload                   true
spark.hadoop.fs.s3a.connection.maximum            64
# 避免 S3A 提交时 rename 带来的数据不一致（Iceberg 自身提交协议不依赖 rename）
spark.hadoop.mapreduce.fileoutputcommitter.algorithm.version 2

# ---------- 执行 ----------
spark.serializer                                  org.apache.spark.serializer.KryoSerializer
spark.sql.adaptive.enabled                        true
spark.sql.adaptive.coalescePartitions.enabled     true
spark.sql.adaptive.skewJoin.enabled               true
spark.sql.shuffle.partitions                      64
spark.sql.session.timeZone                        UTC
spark.sql.sources.partitionOverwriteMode          dynamic
spark.driver.extraJavaOptions                     -Duser.timezone=UTC -Dfile.encoding=UTF-8
spark.executor.extraJavaOptions                   -Duser.timezone=UTC -Dfile.encoding=UTF-8

# ---------- 事件日志（History Server） ----------
spark.eventLog.enabled                            true
spark.eventLog.dir                                s3a://tmdb-lake/spark-events
spark.eventLog.compress                           true
spark.history.fs.logDirectory                     s3a://tmdb-lake/spark-events
spark.history.fs.cleaner.enabled                  true
spark.history.fs.cleaner.maxAge                   14d
