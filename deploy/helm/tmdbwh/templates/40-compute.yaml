{{- if .Values.flink.enabled }}
# =============================================================================
# Flink（实时）：JobManager + TaskManager
#
# 关键配置：
#   - checkpoint 目录指向对象存储：JobManager 重启后仍能恢复（否则每次重启都从头消费）；
#   - 任务槽数与并行度：实时作业配置 tmdbwh.realtime.parallelism 需 <= 总槽数。
# 生产建议用 Flink Kubernetes Operator 管理作业生命周期与 savepoint。
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: {{ include "tmdbwh.fullname" . }}-flink-jobmanager
  labels:
    {{- include "tmdbwh.componentLabels" (dict "ctx" . "component" "flink-jm") | nindent 4 }}
spec:
  ports:
    - name: rpc
      port: 6123
      targetPort: 6123
    - name: ui
      port: 8081
      targetPort: 8081
    - name: metrics
      port: 9249
      targetPort: 9249
  selector:
    {{- include "tmdbwh.componentSelectorLabels" (dict "ctx" . "component" "flink-jm") | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tmdbwh.fullname" . }}-flink-jobmanager
  labels:
    {{- include "tmdbwh.componentLabels" (dict "ctx" . "component" "flink-jm") | nindent 4 }}
spec:
  replicas: {{ .Values.flink.jobmanager.replicas }}
  selector:
    matchLabels:
      {{- include "tmdbwh.componentSelectorLabels" (dict "ctx" . "component" "flink-jm") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "tmdbwh.componentLabels" (dict "ctx" . "component" "flink-jm") | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9249"
    spec:
      containers:
        - name: jobmanager
          image: "{{ .Values.global.imageRegistry }}{{ .Values.flink.image.repository }}:{{ .Values.flink.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          args: ["jobmanager"]
          env:
            - name: FLINK_PROPERTIES
              value: |
                jobmanager.rpc.address: {{ include "tmdbwh.fullname" . }}-flink-jobmanager
                state.checkpoints.dir: {{ .Values.flink.checkpointDir }}
                state.savepoints.dir: {{ .Values.flink.savepointDir }}
                # 取消作业后保留 checkpoint：升级时可接着跑
                execution.checkpointing.externalized-checkpoint-retention: RETAIN_ON_CANCELLATION
                execution.checkpointing.interval: 30s
                execution.checkpointing.mode: EXACTLY_ONCE
                metrics.reporter.promgateway.class: org.apache.flink.metrics.prometheus.PrometheusPushGatewayReporter
                metrics.reporter.promgateway.host: {{ include "tmdbwh.fullname" . }}-pushgateway
                metrics.reporter.promgateway.port: 9091
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.config.secretName }}
                  key: s3-access-key
                  optional: true
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.config.secretName }}
                  key: s3-secret-key
                  optional: true
          ports:
            - containerPort: 6123
            - containerPort: 8081
            - containerPort: 9249
          readinessProbe:
            httpGet:
              path: /overview
              port: 8081
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tmdbwh.fullname" . }}-flink-taskmanager
  labels:
    {{- include "tmdbwh.componentLabels" (dict "ctx" . "component" "flink-tm") | nindent 4 }}
spec:
  replicas: {{ .Values.flink.taskmanager.replicas }}
  selector:
    matchLabels:
      {{- include "tmdbwh.componentSelectorLabels" (dict "ctx" . "component" "flink-tm") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "tmdbwh.componentLabels" (dict "ctx" . "component" "flink-tm") | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9249"
    spec:
      containers:
        - name: taskmanager
          image: "{{ .Values.global.imageRegistry }}{{ .Values.flink.image.repository }}:{{ .Values.flink.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          args: ["taskmanager"]
          env:
            - name: FLINK_PROPERTIES
              value: |
                jobmanager.rpc.address: {{ include "tmdbwh.fullname" . }}-flink-jobmanager
                taskmanager.numberOfTaskSlots: {{ .Values.flink.taskmanager.slots }}
                taskmanager.memory.process.size: {{ .Values.flink.taskmanager.memory }}
                state.backend: rocksdb
                state.backend.incremental: true
                state.checkpoints.dir: {{ .Values.flink.checkpointDir }}
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.config.secretName }}
                  key: s3-access-key
                  optional: true
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.config.secretName }}
                  key: s3-secret-key
                  optional: true
          ports:
            - containerPort: 6122
            - containerPort: 9249
{{- end }}
{{- if .Values.spark.enabled }}
---
# =============================================================================
# Spark（离线）：Master + Worker
#
# 离线作业通过 spark-submit 提交到该集群；作业 jar 放在共享 PVC（distPvc）。
# 生产建议用 Spark on Kubernetes（spark-submit --master k8s://）或 Spark Operator，
# 让每个作业独占 Executor，避免长任务占满整个 Standalone 集群。
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: {{ include "tmdbwh.fullname" . }}-spark-master
  labels:
    {{- include "tmdbwh.componentLabels" (dict "ctx" . "component" "spark-master") | nindent 4 }}
spec:
  ports:
    - name: rpc
      port: 7077
      targetPort: 7077
    - name: ui
      port: 4040
      targetPort: 8080
  selector:
    {{- include "tmdbwh.componentSelectorLabels" (dict "ctx" . "component" "spark-master") | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tmdbwh.fullname" . }}-spark-master
  labels:
    {{- include "tmdbwh.componentLabels" (dict "ctx" . "component" "spark-master") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "tmdbwh.componentSelectorLabels" (dict "ctx" . "component" "spark-master") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "tmdbwh.componentLabels" (dict "ctx" . "component" "spark-master") | nindent 8 }}
    spec:
      containers:
        - name: master
          image: "{{ .Values.global.imageRegistry }}{{ .Values.spark.image.repository }}:{{ .Values.spark.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          args: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master", "--host", "0.0.0.0", "--port", "7077", "--webui-port", "8080"]
          ports:
            - containerPort: 7077
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          volumeMounts:
            - name: dist
              mountPath: /opt/tmdbwh/dist
            - name: conf
              mountPath: /opt/spark/conf/spark-defaults.conf
              subPath: spark-defaults.conf
            - name: conf
              mountPath: /opt/spark/conf/core-site.xml
              subPath: core-site.xml
      volumes:
        - name: dist
          persistentVolumeClaim:
            claimName: {{ include "tmdbwh.fullname" . }}-dist
        - name: conf
          configMap:
            name: {{ include "tmdbwh.fullname" . }}-config
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tmdbwh.fullname" . }}-spark-worker
  labels:
    {{- include "tmdbwh.componentLabels" (dict "ctx" . "component" "spark-worker") | nindent 4 }}
spec:
  replicas: {{ .Values.spark.worker.replicas }}
  selector:
    matchLabels:
      {{- include "tmdbwh.componentSelectorLabels" (dict "ctx" . "component" "spark-worker") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "tmdbwh.componentLabels" (dict "ctx" . "component" "spark-worker") | nindent 8 }}
    spec:
      containers:
        - name: worker
          image: "{{ .Values.global.imageRegistry }}{{ .Values.spark.image.repository }}:{{ .Values.spark.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          args: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker",
                 "spark://{{ include "tmdbwh.fullname" . }}-spark-master:7077",
                 "-c", {{ .Values.spark.worker.cores | quote }},
                 "-m", {{ .Values.spark.worker.memory | quote }}]
          ports:
            - containerPort: 8081
          volumeMounts:
            - name: dist
              mountPath: /opt/tmdbwh/dist
            - name: conf
              mountPath: /opt/spark/conf/spark-defaults.conf
              subPath: spark-defaults.conf
            - name: conf
              mountPath: /opt/spark/conf/core-site.xml
              subPath: core-site.xml
      volumes:
        - name: dist
          persistentVolumeClaim:
            claimName: {{ include "tmdbwh.fullname" . }}-dist
        - name: conf
          configMap:
            name: {{ include "tmdbwh.fullname" . }}-config
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "tmdbwh.fullname" . }}-dist
  labels:
    {{- include "tmdbwh.labels" . | nindent 4 }}
spec:
  # 作业 jar 由 CI 上传（kubectl cp 或 initContainer 拉取），供 master / worker 共享
  accessModes: ["ReadWriteMany"]
  resources:
    requests:
      storage: {{ .Values.spark.distPvc.size }}
{{- end }}
