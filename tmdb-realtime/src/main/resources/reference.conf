# =============================================================================
# 实时链路配置（tmdbwh.realtime）
#
# 这里的默认值针对"单机 Compose 演示环境"：窗口短、并行度小、批大小小。
# 生产环境通过环境变量或部署级 application.conf 覆盖（见 docs/05-operations.md）。
# =============================================================================
tmdbwh.realtime {
  # ---- Checkpoint / 状态 ----
  checkpoint {
    interval = 30s
    interval = ${?REALTIME_CHECKPOINT_INTERVAL}
    mode = "exactly_once"
    timeout = 5 min
    min-pause = 10s
    # 作业停止时是否保留 checkpoint（升级时保留可做到不断点续跑）
    externalized = true
  }

  # ---- 去重 ----
  dedup {
    # 同一实体"内容未变化"的窗口：超过该时间后状态过期，避免状态无限增长
    state-ttl = 7 d
    state-ttl = ${?REALTIME_DEDUP_TTL}
    # 启用 RocksDB 增量检查点（大状态下显著降低 checkpoint 耗时）
    incremental-checkpoint = true
  }

  # ---- 热度趋势 ----
  trend {
    window-size = 5 min
    window-size = ${?REALTIME_WINDOW_SIZE}
    allowed-lateness = 1 min
    # 分区空闲判定：某 key 长时间无数据时也要推进 watermark，否则窗口永不触发
    idleness = 2 min
  }

  # ---- 飙升检测 ----
  surge {
    # 涨幅阈值：当前窗口均值 / 基线均值
    ratio-threshold = 1.5
    ratio-threshold = ${?REALTIME_SURGE_RATIO}
    # 窗口内最少样本数：样本太少时涨幅不可信
    min-samples = 3
    # 基线热度下限：冷门内容（如 1.0）翻倍没有业务意义
    min-baseline = 20.0
  }

  # ---- Sink ----
  sink {
    batch-size = 1000
    batch-size = ${?REALTIME_SINK_BATCH}
    # flush 间隔（checkpoint 之外的兜底，避免低流量下数据长时间不落库）
    flush-interval = 5s
    max-retries = 3
  }

  # ---- 写入目标表（与 ClickHouse 迁移脚本 V3 / V9 对应）----
  tables {
    change-event = "ods.ods_change_event"
    popularity-event = "ods.ods_popularity_event"
    movie-popularity = "rt.rt_movie_popularity"
    surge-alert = "rt.rt_surge_alert"
  }

  # ---- 并行度 ----
  parallelism = 2
  parallelism = ${?REALTIME_PARALLELISM}
}
