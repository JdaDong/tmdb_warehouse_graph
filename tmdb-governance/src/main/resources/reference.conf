# =============================================================================
# 数据治理配置（tmdbwh.governance）
#
# 规则、策略、指标口径全部外置为配置：治理规则会随业务变化频繁调整，
# 如果写在代码里，每次调整都要重新发版，治理就会逐渐"跟不上业务"而被绕过。
# =============================================================================
tmdbwh.governance {
  # ---------------------------------------------------------------- 数据质量
  quality {
    # 检查失败时是否让任务以非 0 退出（调度系统据此决定告警 / 阻断下游）
    fail-on-blocker = true
    fail-on-blocker = ${?GOVERNANCE_FAIL_ON_BLOCKER}

    rules = [
      {
        id = "ods.change_event.row_count"
        type = "ROW_COUNT"
        table = "ods.ods_change_event"
        # 每天必须有数据：完全为空通常意味着采集作业挂了
        min = 1
        severity = "BLOCKER"
      }
      {
        id = "dwd.dim_movie.row_count"
        type = "ROW_COUNT"
        table = "dwd.dim_movie"
        min = 1
        severity = "BLOCKER"
      }
      {
        id = "dwd.dim_movie.unique_version"
        type = "UNIQUE"
        table = "dwd.dim_movie"
        columns = ["movie_id", "valid_from"]
        max-duplicates = 0
        severity = "BLOCKER"
      }
      {
        id = "dwd.dim_movie.title_not_null"
        type = "NOT_NULL"
        table = "dwd.dim_movie"
        column = "title"
        max-null-ratio = 0.0
        severity = "BLOCKER"
      }
      {
        id = "dwd.dim_movie.popularity_range"
        type = "RANGE"
        table = "dwd.dim_movie"
        column = "popularity"
        min = 0
        max = 10000
        severity = "WARN"
      }
      {
        id = "dwd.dim_movie.vote_average_range"
        type = "RANGE"
        table = "dwd.dim_movie"
        column = "vote_average"
        min = 0
        max = 10
        severity = "WARN"
      }
      {
        id = "dws.movie_metric.freshness"
        type = "FRESHNESS"
        table = "dws.dws_movie_metric_1d"
        column = "dt"
        max-lag-days = 1
        severity = "BLOCKER"
      }
      {
        id = "dwd.fact_credit.referential_movie"
        type = "REFERENTIAL"
        table = "dwd.fact_movie_credit"
        column = "movie_id"
        ref-table = "dwd.dim_movie"
        ref-column = "movie_id"
        max-orphans = 0
        severity = "WARN"
      }
      {
        id = "ads.top_movie.row_count"
        type = "ROW_COUNT"
        table = "ads.ads_top_movie"
        min = 1
        severity = "WARN"
      }
    ]
  }

  # ---------------------------------------------------------------- 血缘（声明式）
  # 自动化解析 SQL 血缘成本很高且容易漏（尤其是 Spark DataFrame 作业），
  # 因此对核心链路采用"声明式血缘"：由作业在写入时显式声明上下游。
  lineage {
    edges = [
      { src = "ods.ods_movie_raw",  dst = "dwd.dim_movie",              job = "spark-offline-dwd", columns = [] }
      { src = "ods.ods_movie_raw",  dst = "dwd.fact_movie_credit",      job = "spark-offline-dwd", columns = [] }
      { src = "dwd.dim_movie",      dst = "dws.dws_movie_metric_1d",    job = "spark-offline-dws", columns = [] }
      { src = "dwd.dim_movie",      dst = "dws.dws_genre_year_metric",  job = "spark-offline-dws", columns = [] }
      { src = "dwd.fact_movie_credit", dst = "dws.dws_person_career",   job = "spark-offline-dws", columns = [] }
      { src = "dws.dws_movie_metric_1d", dst = "ads.ads_top_movie",     job = "spark-offline-ads", columns = [] }
      { src = "dws.dws_movie_metric_1d", dst = "ads.ads_roi_ranking",   job = "spark-offline-ads", columns = [] }
      { src = "dws.dws_person_career",   dst = "ads.ads_person_influence", job = "spark-offline-ads", columns = [] }
      { src = "ods.ods_popularity_event", dst = "rt.rt_movie_popularity", job = "flink-popularity-trend", columns = [] }
      { src = "rt.rt_movie_popularity",  dst = "rt.rt_surge_alert",     job = "flink-popularity-trend", columns = [] }
      { src = "dwd.dim_movie",      dst = "graph:Movie",                 job = "neo4j-loader", columns = [] }
      { src = "dwd.dim_person",     dst = "graph:Person",                job = "neo4j-loader", columns = [] }
    ]
  }

  # ---------------------------------------------------------------- 生命周期
  lifecycle {
    # 默认 dry-run：生命周期动作不可逆，必须先看计划再执行
    dry-run = true
    dry-run = ${?GOVERNANCE_LIFECYCLE_DRY_RUN}

    policies = [
      { table = "ods.ods_change_event",      ttl-days = 90,  cold-after-days = 7,  partition-days = 90 }
      { table = "ods.ods_popularity_event",  ttl-days = 90,  cold-after-days = 7,  partition-days = 90 }
      { table = "rt.rt_movie_popularity",    ttl-days = 30,  cold-after-days = 0,  partition-days = 30 }
      { table = "rt.rt_surge_alert",         ttl-days = 30,  cold-after-days = 0,  partition-days = 30 }
      { table = "dwd.dim_movie",             ttl-days = 0,   cold-after-days = 0,  partition-days = 0 }
      { table = "governance.dq_result",      ttl-days = 365, cold-after-days = 90, partition-days = 365 }
      { table = "governance.query_cost_report", ttl-days = 180, cold-after-days = 30, partition-days = 180 }
    ]
  }

  # ---------------------------------------------------------------- 权限（RBAC）
  access {
    roles = {
      analyst = {
        # 只读汇总层与报表层，禁止直接查贴源（避免误用未清洗数据）
        grants = ["dws.*:SELECT", "ads.*:SELECT", "rt.*:SELECT"]
      }
      engineer = {
        grants = ["*.*:SELECT", "ods.*:INSERT", "dwd.*:INSERT", "dws.*:INSERT", "ads.*:INSERT",
                  "governance.*:INSERT"]
      }
      admin = {
        grants = ["*.*:ALL"]
      }
    }
  }

  # ---------------------------------------------------------------- 指标口径
  metrics {
    definitions = [
      { name = "movie_popularity",    table = "dws.dws_movie_metric_1d", expression = "avg(popularity)",
        owner = "data-platform", description = "电影平均热度（TMDB popularity 的日均值）" }
      { name = "movie_vote_average",  table = "dws.dws_movie_metric_1d", expression = "avg(vote_average)",
        owner = "data-platform", description = "电影平均评分" }
      { name = "movie_roi",           table = "ads.ads_roi_ranking",     expression = "revenue / budget",
        owner = "data-platform", description = "投资回报率（票房 / 预算），预算未知时不参与" }
      { name = "genre_movie_count",   table = "dws.dws_genre_year_metric", expression = "sum(movie_count)",
        owner = "data-platform", description = "类型 × 年份的电影数量" }
      { name = "person_influence",    table = "ads.ads_person_influence", expression = "influence_score",
        owner = "graph-team",     description = "人物影响力综合分（热度 + 作品数 + 口碑）" }
    ]
  }
}
