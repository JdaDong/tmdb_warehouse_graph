# =============================================================================
# TMDB Warehouse 平台默认配置（Typesafe Config / HOCON）
#
# 加载优先级（高 → 低）：
#   1. JVM 系统属性            -Dtmdbwh.tmdb.rate-limit-per-second=20
#   2. -Dconfig.file 指定的文件  例如 config/application.conf
#   3. classpath: application.conf
#   4. 本文件 reference.conf（下方 ${?ENV} 表示"若环境变量存在则覆盖"）
#
# 约定：所有密钥类配置默认为空，只允许通过环境变量或密钥管理系统注入，禁止写入代码仓库。
# =============================================================================
tmdbwh {
  # 运行环境标识：dev / test / staging / prod，用于日志、指标标签与告警路由
  env = "dev"
  env = ${?TMDBWH_ENV}

  # 业务日期所属时区（分区 dt 按此时区切分）；TMDB changes 接口本身按 UTC 计算
  business-zone = "UTC"
  business-zone = ${?TMDBWH_BUSINESS_ZONE}

  # ---------------------------------------------------------------------------
  # TMDB 数据源
  # ---------------------------------------------------------------------------
  tmdb {
    base-url = "https://api.themoviedb.org/3"
    base-url = ${?TMDB_BASE_URL}
    # 每日 ID 导出文件地址：{export-base-url}/movie_ids_09_30_2026.json.gz
    export-base-url = "https://files.tmdb.org/p/exports"
    export-base-url = ${?TMDB_EXPORT_BASE_URL}
    # v4 Read Access Token（推荐，Bearer 认证）；与 api-key 二选一
    bearer-token = ""
    bearer-token = ${?TMDB_BEARER_TOKEN}
    # v3 API Key（兼容方式，作为查询参数 api_key 传递）
    api-key = ""
    api-key = ${?TMDB_API_KEY}
    language = "en-US"
    language = ${?TMDB_LANGUAGE}
    # 客户端限流：TMDB 官方上限约 50 req/s，保留余量
    rate-limit-per-second = 40
    rate-limit-per-second = ${?TMDB_RATE_LIMIT}
    # 详情拉取并发线程数
    max-concurrency = 16
    max-concurrency = ${?TMDB_MAX_CONCURRENCY}
    connect-timeout = 10s
    read-timeout = 30s
    # 单请求最大重试次数（429 / 5xx / IO 异常）
    max-retries = 5
    # Mock 模式：指向 WireMock 模拟的 TMDB，不校验凭证，用于本地联调与 CI
    mock-mode = false
    mock-mode = ${?TMDB_MOCK_MODE}
  }

  # ---------------------------------------------------------------------------
  # 对象存储（MinIO / S3）
  # ---------------------------------------------------------------------------
  s3 {
    endpoint = "http://localhost:9000"
    endpoint = ${?S3_ENDPOINT}
    region = "us-east-1"
    region = ${?S3_REGION}
    access-key = ""
    access-key = ${?S3_ACCESS_KEY}
    secret-key = ""
    secret-key = ${?S3_SECRET_KEY}
    # 数据湖桶：raw/ 原始区、warehouse/ Iceberg 仓库、_state/ 采集状态、quarantine/ 隔离区
    bucket = "tmdb-lake"
    bucket = ${?S3_BUCKET}
    # MinIO 需使用路径风格访问
    path-style-access = true
  }

  # ---------------------------------------------------------------------------
  # Kafka
  # ---------------------------------------------------------------------------
  kafka {
    bootstrap-servers = "localhost:9092"
    bootstrap-servers = ${?KAFKA_BOOTSTRAP_SERVERS}
    client-id-prefix = "tmdbwh"
    topics {
      # 实体变更事件（EventEnvelope，key = entityType:entityId）
      entity-change = "tmdb.entity.change"
      # 热度观测事件
      popularity = "tmdb.popularity"
      # 死信队列：反序列化失败 / Sink 重试耗尽
      dlq = "tmdb.dlq"
      # 实时告警（热度飙升等）
      alert = "tmdb.alert"
    }
    # 透传给 Kafka 客户端的额外属性（如 SASL / SSL），键为原生 Kafka 配置名
    properties {}
  }

  # ---------------------------------------------------------------------------
  # ClickHouse（OLAP）
  # ---------------------------------------------------------------------------
  clickhouse {
    url = "jdbc:clickhouse://localhost:8123/default"
    url = ${?CLICKHOUSE_URL}
    user = "default"
    user = ${?CLICKHOUSE_USER}
    password = ""
    password = ${?CLICKHOUSE_PASSWORD}
    # 集群名：为空表示单机，非空时 DDL 自动追加 ON CLUSTER
    cluster = ""
    cluster = ${?CLICKHOUSE_CLUSTER}
    max-pool-size = 8
    connect-timeout = 10s
    socket-timeout = 300s
    # 批量写入默认批大小
    batch-size = 10000
  }

  # ---------------------------------------------------------------------------
  # Neo4j（图数据库）
  # ---------------------------------------------------------------------------
  neo4j {
    uri = "bolt://localhost:7687"
    uri = ${?NEO4J_URI}
    user = "neo4j"
    user = ${?NEO4J_USER}
    password = ""
    password = ${?NEO4J_PASSWORD}
    database = "neo4j"
    database = ${?NEO4J_DATABASE}
    # UNWIND 批量 MERGE 的批大小
    batch-size = 5000
    max-connection-pool-size = 50
  }

  # ---------------------------------------------------------------------------
  # Iceberg 湖仓
  # ---------------------------------------------------------------------------
  iceberg {
    catalog-name = "lake"
    # hive：使用 Hive Metastore 作为 Catalog
    catalog-type = "hive"
    metastore-uri = "thrift://localhost:9083"
    metastore-uri = ${?HIVE_METASTORE_URI}
    warehouse = "s3a://tmdb-lake/warehouse"
    warehouse = ${?ICEBERG_WAREHOUSE}
  }
}
