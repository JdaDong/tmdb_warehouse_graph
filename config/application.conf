# =============================================================================
# 部署级配置覆盖文件（示例：本地 Docker Compose 环境）
#
# 使用方式：java -Dconfig.file=config/application.conf -jar xxx-all.jar ...
# 默认值定义在 tmdb-common/src/main/resources/reference.conf，这里只写与环境相关的差异项。
# 密钥类配置请勿写在此文件中，统一通过环境变量注入（见 .env.example）。
# 本文件会自动以 reference.conf 为兜底（ConfigFactory.load 语义），无需 include。
# =============================================================================

tmdbwh {
  env = "local"
  env = ${?TMDBWH_ENV}

  tmdb {
    # 本地联调默认走较低限流，避免触发 TMDB 风控
    rate-limit-per-second = 20
    rate-limit-per-second = ${?TMDB_RATE_LIMIT}
    max-concurrency = 8
    max-concurrency = ${?TMDB_MAX_CONCURRENCY}
  }

  clickhouse {
    url = "jdbc:clickhouse://localhost:8123/default"
    url = ${?CLICKHOUSE_URL}
    max-pool-size = 4
  }

  neo4j {
    batch-size = 2000
  }
}
