name: CI

# =============================================================================
# 持续集成：静态校验 → 构建（Checkstyle + 单元测试 + 覆盖率门禁）→ 集成测试 → 打包
#
# 设计原则：
#   - 静态校验（配置 / SQL / 脚本语法 / DAG 副本）不需要 Docker，优先跑，失败尽早返回；
#   - 集成测试依赖 Docker（Testcontainers），单独一个 job，允许在缺少 Docker 的环境跳过；
#   - 打包产物上传 artifact，便于后续发布流程直接取用。
# =============================================================================
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Spark 3.5 / Flink 1.18 官方支持到 JDK 17
  JAVA_VERSION: '17'
  MAVEN_OPTS: -Dhttp.keepAlive=false -Dmaven.wagon.http.pool=false

jobs:
  validate:
    name: 静态校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 校验配置 / XML / JSON / SQL / Mock 引用
        run: bash scripts/validate-config.sh

      - name: 校验 Helm Chart 内 DAG 副本一致
        run: bash scripts/sync-dags.sh --check

      - name: 校验 Shell 脚本语法
        run: |
          set -euo pipefail
          for f in $(find scripts -name '*.sh'); do bash -n "$f"; done
          echo "shell 语法检查通过"

      - name: 校验 Python DAG 语法
        run: |
          python3 -m compileall -q airflow/dags deploy/helm/tmdbwh/dags
          echo "DAG 语法检查通过"

      - name: 校验 Helm Chart（需要 helm CLI）
        run: |
          if command -v helm >/dev/null 2>&1; then
            helm lint deploy/helm/tmdbwh
          else
            echo "未安装 helm，跳过 chart lint"
          fi

  build:
    name: 构建与单元测试
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: 编译 + Checkstyle + 单元测试 + 覆盖率门禁 + 打包
        run: mvn -B -ntp clean verify

      - name: 上传覆盖率报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: '**/target/site/jacoco/'
          if-no-files-found: ignore

      - name: 上传各模块 fat-jar
        uses: actions/upload-artifact@v4
        with:
          name: dist-jars
          path: dist/jars/*.jar
          if-no-files-found: error

  integration:
    name: 集成测试（Testcontainers）
    runs-on: ubuntu-latest
    needs: build
    # 集成测试需要 Docker；禁用 docker 的自托管 runner 会自动跳过本 job
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: 运行集成测试
        run: mvn -B -ntp -Pit verify

  smoke:
    name: 端到端冒烟（Compose）
    runs-on: ubuntu-latest
    needs: build
    # 冒烟需要拉起全部容器，耗时较长；仅在 main 分支与手动触发时执行
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: 由 .env.example 生成 .env
        run: make env-init

      - name: 打包（跳过测试，复用已构建的依赖）
        run: make package

      - name: 启动环境
        run: make up

      - name: 端到端冒烟
        run: make smoke

      - name: 失败时输出容器日志
        if: failure()
        run: make logs || true

      - name: 停止环境
        if: always()
        run: make down
